<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>記帳系統</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    padding:30px;
    background:#ffe6f0;
    font-family:"Microsoft JhengHei";
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:25px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    color:#ff4f9a;
    text-align:center;
    margin-bottom:30px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    border:none;
    background:#ff5fa2;
    color:white;
    padding:12px 25px;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
}

.form{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.form input,
.form select{
    flex:1;
    min-width:150px;
    padding:12px;
    border:2px solid #ffb6d5;
    border-radius:12px;
    font-size:16px;
}

.addBtn{
    background:#ff5fa2;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:12px;
    cursor:pointer;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    padding:15px;
    border-radius:15px;
    background:#fff6fa;
}

.income{
    color:green;
    font-weight:bold;
}

.expense{
    color:red;
    font-weight:bold;
}

.deleteBtn{
    background:#ff5b5b;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.summary{
    line-height:2;
    font-size:22px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="top">

<h1>💰 記帳系統</h1>

<button
class="logout"
onclick="logout()"
>
登出
</button>

</div>

<div class="form">

<select id="type">
<option value="收入">收入</option>
<option value="支出">支出</option>
</select>

<input
type="number"
id="amount"
placeholder="輸入金額"
>

<input
type="text"
id="category"
placeholder="輸入類別"
>

<input
type="text"
id="note"
placeholder="備註"
>

<button
class="addBtn"
onclick="addAccount()"
>
新增
</button>

</div>

</div>

<div
id="list"
class="card"
></div>

<div class="card">

<h2 style="color:#ff4f9a;">
收支統計
</h2>

<div
id="summary"
class="summary"
></div>

</div>

<div class="card">

<h2 style="color:#ff4f9a;">
收支圖表
</h2>

<canvas id="myChart"></canvas>

</div>

</div>

<script>

let chart;

loadData();

async function addAccount(){

    const type =
    document.getElementById("type").value;

    const amount =
    document.getElementById("amount").value;

    const category =
    document.getElementById("category").value;

    const note =
    document.getElementById("note").value;

    await fetch("/api/accounts",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            type,
            amount,
            category,
            note
        })

    });

    document.getElementById("amount").value="";
    document.getElementById("category").value="";
    document.getElementById("note").value="";

    loadData();

}

async function deleteAccount(id){

    await fetch("/api/accounts/"+id,{
        method:"DELETE"
    });

    loadData();

}

async function loadData(){

    const res =
    await fetch("/api/accounts");

    const data =
    await res.json();

    let html="";

    let income=0;
    let expense=0;

    data.forEach(item=>{

        if(item.type==="收入"){
            income += Number(item.amount);
        }else{
            expense += Number(item.amount);
        }

        html += `
        <div class="item">

        <div>

        <div class="${
            item.type==="收入"
            ? "income"
            : "expense"
        }">

        ${item.type}
        ｜${item.amount} 元｜
        ${item.category}

        </div>

        <div>
        ${item.note || ""}
        </div>

        <div>
        ${
            item.createdAt
            ? new Date(item.createdAt)
            .toLocaleDateString()
            : ""
        }
        </div>

        </div>

        <button
        class="deleteBtn"
        onclick="deleteAccount('${item._id}')"
        >
        刪除
        </button>

        </div>
        `;

    });

    document.getElementById("list").innerHTML =
    html;

    document.getElementById("summary").innerHTML =
    `
    <p>總收入：${income} 元</p>
    <p>總支出：${expense} 元</p>
    <p>結餘：${income-expense} 元</p>
    `;

    if(chart){
        chart.destroy();
    }

    chart =
    new Chart(
        document.getElementById("myChart"),
        {
            type:"pie",
            data:{
                labels:[
                    "收入",
                    "支出"
                ],
                datasets:[{
                    data:[
                        income,
                        expense
                    ]
                }]
            }
        }
    );

}

function logout(){

    location.href =
    "/login.html";

}

</script>

</body>
</html>
